name: Backend Security Audit & Vulnerability Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend-security-scan:
    name: Backend SAST & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          npm install -g exceljs

      - name: Run Semgrep Security Analysis
        run: |
          python -m pip install semgrep || true
          semgrep --config=auto backend/ || true

      - name: Generate Vulnerability Excel & Report Artifacts
        run: |
          node "Vulnerability Test Results/generate_vulnerability_excels.js"

      - name: Upload Security Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vulnerability-Security-Audit-Reports
          path: Vulnerability Test Results/**
          retention-days: 30

      - name: Security Audit Summary
        run: |
          cat "Vulnerability Test Results/executive-summary.md" >> $GITHUB_STEP_SUMMARY
