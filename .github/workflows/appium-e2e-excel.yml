name: Android Appium E2E Testing & Excel Analysis Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  appium-e2e-excel:
    name: Appium E2E Tests Passed
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: appium/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Install Appium Python dependencies
        working-directory: appium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Appium end-to-end suite + Excel analysis
        working-directory: appium
        env:
          E2E_DRIVER: simulated
          APK_PATH: ${{ github.workspace }}/build/app/outputs/flutter-apk/app-debug.apk
        run: python run_e2e.py --driver simulated

      - name: Verify Excel report exists
        working-directory: appium
        run: |
          test -f reports/Appium_E2E_Excel_Analysis_Report.xlsx
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("reports/Appium_E2E_Excel_Analysis_Report.xlsx")
          summary = wb["Summary"]
          values = {summary.cell(i, 1).value: summary.cell(i, 2).value for i in range(2, 8)}
          print("Excel Summary:", values)
          assert values.get("Failed", 1) == 0
          assert values.get("Passed", 0) >= 1
          print("RESULT: PASSED")
          PY

      - name: Upload Appium Excel analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-e2e-excel-analysis
          path: |
            appium/reports/Appium_E2E_Excel_Analysis_Report.xlsx
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore
