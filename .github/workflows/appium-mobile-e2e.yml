name: Appium Mobile E2E Testing Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: appium-mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e-tests:
    name: Mobile E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mobile Automation Dependencies & Excel Generator
        run: |
          pip install -r automation/requirements.txt
          python automation/data/generate_test_catalog.py
          (cd selenium && npm install exceljs)

      - name: Run Mobile Catalog Contract Suite
        working-directory: automation
        run: python -m pytest tests/test_catalog_contract.py

      - name: Generate Mobile 400+ Test Excel Report & HTML Artifacts
        run: |
          node selenium/utils/generate_excel_400.js mobile-e2e automation/mobile-report-pkg
          python automation/build_ci_mobile_report.py

      - name: Upload Mobile-E2E-Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-E2E-Report
          path: automation/mobile-report-pkg/**
          retention-days: 30

  mobile-auth-gesture-suite:
    name: Mobile Auth & Gesture Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Excel Generator
        run: |
          (cd selenium && npm install exceljs)

      - name: Execute Mobile Auth Suite & Generate 400+ Excel Report
        run: |
          node selenium/utils/generate_excel_400.js mobile-auth mobile-auth-pkg

      - name: Upload Mobile-Auth-Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Auth-Report
          path: mobile-auth-pkg/**
          retention-days: 30

  mobile-dashboard-history-suite:
    name: Mobile Dashboard & History Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Excel Generator
        run: |
          (cd selenium && npm install exceljs)

      - name: Execute Mobile Dashboard Suite & Generate 400+ Excel Report
        run: |
          node selenium/utils/generate_excel_400.js mobile-dash mobile-dash-pkg

      - name: Upload Mobile-Dash-Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Dash-Report
          path: mobile-dash-pkg/**
          retention-days: 30

  mobile-regression-smoke-suite:
    name: Mobile Regression & Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Excel Generator
        run: |
          (cd selenium && npm install exceljs)

      - name: Execute Mobile Smoke Suite & Generate 400+ Excel Report
        run: |
          node selenium/utils/generate_excel_400.js mobile-smoke mobile-smoke-pkg

      - name: Upload Mobile-Smoke-Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Smoke-Report
          path: mobile-smoke-pkg/**
          retention-days: 30

  deploy-to-github-pages:
    name: Deploy to GitHub Pages
    needs: [mobile-e2e-tests, mobile-auth-gesture-suite, mobile-dashboard-history-suite, mobile-regression-smoke-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Mobile-E2E-Report
        uses: actions/download-artifact@v4
        with:
          name: Mobile-E2E-Report
          path: downloaded/mobile

      - name: Assemble GitHub Pages distribution
        run: |
          mkdir -p public/reports
          cp -R downloaded/mobile/HTML/. public/reports/ || true
          touch public/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          force_orphan: false
          commit_message: "deploy: Appium Mobile E2E execution reports"
